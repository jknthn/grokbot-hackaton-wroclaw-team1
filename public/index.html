<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DISTRICT — Back Room</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="join-screen" class="panel join">
      <p class="eyebrow">NIGHT DISTRICT · INVITE ONLY</p>
      <h1>BACK ROOM</h1>
      <p class="sub">City table · keep your mouth shut · pin to enter</p>
      <label>Alias <input id="name" maxlength="24" placeholder="VITO" autocomplete="nickname" /></label>
      <label>Door PIN <input id="pin" maxlength="8" placeholder="4821" value="4821" autocomplete="off" /></label>
      <label class="check"><input type="checkbox" id="want-host" /> Run the table (host)</label>
      <button id="join-btn" type="button">ENTER</button>
      <p id="join-error" class="error" hidden></p>
    </div>

    <div id="game" class="game" hidden>
      <header class="bar">
        <div>
          <strong id="phase-label" class="phase-hud">LOBBY</strong>
          <span id="you-label" class="muted"></span>
        </div>
        <div id="host-controls" class="host" hidden>
          <button type="button" data-phase="lobby">LOBBY</button>
          <button type="button" data-phase="talk">TALK</button>
          <button type="button" data-phase="done">DONE</button>
        </div>
      </header>

      <main class="layout">
        <section class="table-wrap">
          <div id="table" class="table" aria-label="Seats"></div>
          <p class="hint">Quiet room? Host opens <em>TALK</em>.</p>
        </section>
        <section id="chat-wrap" class="chat-wrap">
          <div id="chat" class="chat"></div>
          <form id="say-form" class="say">
            <input id="say-input" maxlength="280" placeholder="Speak carefully…" autocomplete="off" />
            <button type="submit">SEND</button>
          </form>
          <button id="ready-btn" type="button" class="secondary">READY</button>
        </section>
      </main>
      <p id="game-error" class="error" hidden></p>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
